<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Organize Hub is a simple personal workspace for tasks, planning, notes, messages, projects, and gaming.">
<meta name="theme-color" content="#635bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organize Hub">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Organize Hub</title>
<style>
.app-topbar{display:none}.mobile-nav{display:none}.app-badge{font-size:11px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:999px}.install-btn{display:none}
:root{color-scheme:light dark;--bg:light-dark(#f7f8fc,#10131a);--panel:light-dark(#fff,#171b24);--panel2:light-dark(#f1f3f8,#202531);--text:light-dark(#182033,#f4f6fb);--muted:light-dark(#687086,#aeb6c8);--line:light-dark(#e3e6ee,#2b3240);--accent:light-dark(#635bff,#827bff);--accent2:light-dark(#ecebff,#29264a);--green:light-dark(#18845b,#57c99b);--red:light-dark(#b33a46,#ff7180)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:var(--bg)}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:var(--panel);position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center;margin:4px 10px 28px}.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:white}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:11px;text-align:left;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--text)}.bottom{position:absolute;bottom:20px;font-size:12px;color:var(--muted);padding:0 10px}.main{padding:30px;max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}.title{font-size:28px;font-weight:800;letter-spacing:-.5px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 25px rgba(20,25,40,.04)}.wide{grid-column:span 2}.full{grid-column:1/-1}.card h3{margin:0 0 15px;font-size:15px}.muted{color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{font-size:11px;color:var(--muted);text-align:center;padding:5px}.date{min-height:75px;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}.date:hover{border-color:var(--accent)}.date strong{font-size:12px}.event{font-size:10px;margin-top:8px;padding:4px 5px;border-radius:6px;background:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.check{width:17px;height:17px;border:1px solid var(--line);border-radius:5px;cursor:pointer;flex:0 0 auto}.item.done{opacity:.55;text-decoration:line-through}.pill{margin-left:auto;font-size:11px;padding:5px 7px;border-radius:7px;background:var(--panel2);color:var(--muted)}.note{padding:14px;border-radius:11px;background:var(--panel2)}.note b{display:block;margin-bottom:5px}.compose{display:grid;gap:10px}.input,.textarea,.select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px;font:inherit}.textarea{min-height:120px;resize:vertical}.creator{display:grid;grid-template-columns:1fr 1fr;gap:10px}.create-tile{padding:18px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.create-tile:hover{border-color:var(--accent);background:var(--accent2)}.search{max-width:360px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px}.stat strong{font-size:24px;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toast{position:fixed;right:25px;bottom:25px;background:var(--text);color:var(--bg);padding:11px 14px;border-radius:10px;display:none;font-size:13px;z-index:20}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:1fr}.wide,.full{grid-column:span 1}.creator,.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
@media(max-width:900px){.app-topbar{display:flex;position:sticky;top:0;z-index:10;align-items:center;justify-content:flex-start;gap:8px;padding:5px 9px;border-bottom:1px solid var(--line);background:var(--panel);height:48px;max-height:48px;overflow:hidden}.app-topbar .brand{margin:0;font-size:13px}.app-topbar .logo{width:24px;height:24px;border-radius:7px}.app-topbar .app-badge{font-size:9px;padding:3px 6px;margin-left:auto}.app-topbar .install-btn{padding:6px 9px;font-size:11px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;z-index:15;padding:7px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 10px 30px rgba(20,25,40,.16)}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:8px 3px;border-radius:10px;font-size:10px;cursor:pointer}.main{padding-bottom:92px}.install-btn{display:inline-block}}
</style>
<style>
.focus-mode{max-width:900px}.step{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}.helper{font-size:12px;color:var(--muted);line-height:1.5}.template-row{display:flex;gap:8px;flex-wrap:wrap}.template{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 10px;cursor:pointer}.template:hover{border-color:var(--accent);background:var(--accent2)}.preview{white-space:pre-wrap;line-height:1.6;min-height:120px}.send-note{padding:10px;border-radius:10px;background:var(--accent2);font-size:12px;line-height:1.5}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}.input:focus,.textarea:focus,.select:focus,.btn:focus,.template:focus{outline:3px solid var(--accent2);outline-offset:2px}
</style>
<style>
.timer-card{max-width:760px;margin:auto}.timer-display{text-align:center;font-size:72px;font-weight:850;letter-spacing:-3px;padding:22px 10px 12px;font-variant-numeric:tabular-nums}.timer-status{text-align:center;color:var(--muted);margin-bottom:18px}.timer-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.timer-presets{display:flex;gap:8px;flex-wrap:wrap}.timer-presets .btn.active{background:var(--accent2);border-color:var(--accent);color:var(--text)}.timer-custom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timer-label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}@media(max-width:600px){.timer-display{font-size:54px}.timer-custom{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-topbar"><div class="brand"><span class="logo">✦</span>Organize Hub</div><button class="btn install-btn" onclick="installApp()">Install</button><span class="app-badge">All devices</span></div>
<div class="app"><div class="shell">
<aside class="side"><div class="brand"><span class="logo">✦</span>Organize Hub</div><div class="nav">
<button class="active" onclick="show('dashboard',this)">⌂ &nbsp;Dashboard</button><button onclick="show('planner',this)">▦ &nbsp;Planner</button><button onclick="pomodoro();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">⏱ &nbsp;Focus Timer</button><button onclick="show('notes',this)">✎ &nbsp;Notes</button><button onclick="show('messages',this)">↗ &nbsp;Email & Messages</button><button onclick="games();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">🎮 &nbsp;Video Games</button><button onclick="show('create',this)">＋ &nbsp;Create</button>
</div><div class="bottom">Your all-in-one personal workspace</div></aside>
<main class="main" id="main"></main></div></div><div class="mobile-nav"><button onclick="show('dashboard',this)">⌂<br>Home</button><button onclick="show('planner',this)">▦<br>Plan</button><button onclick="pomodoro();document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.remove('active'));this.classList.add('active')">⏱<br>Focus</button><button onclick="show('notes',this)">✎<br>Notes</button><button onclick="show('messages',this)">✉<br>Mail</button></div><div class="toast" id="toast"></div>
<script>
if(location.protocol==='file:'){document.documentElement.dataset.localFile='true'}
function installApp(){if(window.deferredInstallPrompt){window.deferredInstallPrompt.prompt();window.deferredInstallPrompt.userChoice.finally(()=>{window.deferredInstallPrompt=null})}else notify('Use your browser menu to install Organize Hub')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstallPrompt=e;document.querySelector('.install-btn')?.style.setProperty('display','inline-block')});
const saved=JSON.parse(localStorage.getItem('organizeHub')||'null');const data=saved||{tasks:[{text:'Finish science project',when:'Today',done:false},{text:'Plan weekend schedule',when:'Tomorrow',done:false},{text:'Read 20 pages',when:'Fri',done:false}],notes:[{title:'Project ideas',body:'Build a simple habit tracker and a reading log.'},{title:'Things to remember',body:'Ask about the club meeting after school.'},{title:'Brain dump',body:'Ideas, reminders, and creative sparks go here.'}],plans:[{text:'Science project',date:'2026-10-02'},{text:'Club meeting',date:'2026-10-08'}],drafts:[],projects:[]};function persist(){localStorage.setItem('organizeHub',JSON.stringify(data))}function shell(title,sub,content){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">${sub}</div><div class="title">${title}</div></div><div class="actions"><button class="btn" onclick="persist();notify('Saved on this device')">Save</button><button class="btn primary" onclick="show('create')">+ New</button></div></div>${content}`}function show(page,el){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');({dashboard,planner,notes,messages,create}[page]||dashboard)()}function dashboard(){const done=data.tasks.filter(t=>t.done).length;shell('Good evening','Thursday, October 1, 2026',`<div class="grid"><section class="card full"><div class="stats"><div class="stat"><strong>${data.tasks.length}</strong><span class="muted">Tasks</span></div><div class="stat"><strong>${data.notes.length}</strong><span class="muted">Notes</span></div><div class="stat"><strong>${done}</strong><span class="muted">Completed</span></div></div></section><section class="card wide"><h3>October 2026</h3><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<div class="day">${x}</div>`).join('')}${Array.from({length:31},(_,i)=>{const day=i+1,ev=data.plans.find(p=>Number(p.date.slice(-2))===day);return `<div class="date" onclick="addQuickPlan(${day})"><strong>${day}</strong>${ev?`<div class="event">${escapeHtml(ev.text)}</div>`:''}</div>`}).join('')}</div></section><section class="card"><h3>Today</h3><div class="list">${data.tasks.map((t,i)=>`<div class="item ${t.done?'done':''}"><span class="check" onclick="toggleTask(${i})">${t.done?'✓':''}</span><span>${escapeHtml(t.text)}</span><span class="pill">${escapeHtml(t.when)}</span></div>`).join('')}</div></section><section class="card"><h3>Quick notes</h3><div class="list">${data.notes.slice(0,4).map(n=>`<div class="note" onclick="show('notes')"><b>${escapeHtml(n.title)}</b><span class="muted">${escapeHtml(n.body.slice(0,100))}</span></div>`).join('')}</div></section><section class="card wide"><h3>Quick create</h3><div class="creator"><div class="create-tile" onclick="show('messages')"><b>✉ Message</b><div class="muted">Draft an email or text.</div></div><div class="create-tile" onclick="show('create')"><b>✦ Project</b><div class="muted">Start a project, checklist, or document.</div></div></div></section></div>`)}function planner(){shell('Planner','Plan your time',`<div class="grid"><section class="card wide"><h3>Your plans</h3><div class="toolbar"><button class="btn" onclick="filterPlans('all')">All</button><button class="btn" onclick="filterPlans('week')">This week</button></div><div class="list" id="planList">${data.plans.map((p,i)=>`<div class="item"><span>▦</span><span><b>${escapeHtml(p.text)}</b><br><small class="muted">${p.date||'No date'}</small></span><button class="btn danger" onclick="deletePlan(${i})">Delete</button></div>`).join('')||'<div class="muted">No plans yet.</div>'}</div></section><section class="card"><h3>Add a plan</h3><div class="compose"><input class="input" placeholder="What needs to happen?" id="planText"><input class="input" type="date" id="planDate" value="2026-10-01"><button class="btn primary" onclick="addPlan()">Add to planner</button></div></section><section class="card"><h3>Add a task</h3><div class="compose"><input class="input" placeholder="Task name" id="taskText"><input class="input" placeholder="When? e.g. Tomorrow" id="taskWhen"><button class="btn primary" onclick="addTask()">Add task</button></div></section></div>`)}function notes(){shell('Notes','Capture ideas',`<div class="grid"><section class="card wide"><h3>Your notes</h3><input class="input search" placeholder="Search notes..." oninput="renderNotes(this.value)" id="noteSearch"><div class="list" id="noteList" style="margin-top:12px"></div></section><section class="card"><h3>New note</h3><div class="compose"><input class="input" id="noteTitle" placeholder="Title"><textarea class="textarea" id="noteBody" placeholder="Start writing..."></textarea><button class="btn primary" onclick="addNote()">Save note</button></div></section></div>`);renderNotes('')}function renderNotes(q){const list=document.getElementById('noteList');if(!list)return;const rows=data.notes.map((n,i)=>({n,i})).filter(x=>(x.n.title+' '+x.n.body).toLowerCase().includes(q.toLowerCase()));list.innerHTML=rows.map(({n,i})=>`<div class="note"><b>${escapeHtml(n.title)}</b><div class="muted">${escapeHtml(n.body)}</div><div class="toolbar" style="margin-top:10px"><button class="btn" onclick="loadNote(${i})">Edit</button><button class="btn danger" onclick="deleteNote(${i})">Delete</button></div></div>`).join('')||'<div class="muted">No matching notes.</div>'}function messages(){shell('Email & Messages','Communicate',`<div class="grid"><section class="card wide"><h3>Compose</h3><div class="compose"><select class="select" id="channel" onchange="channelChanged()"><option>Email</option><option>Text message</option></select><input class="input" id="to" placeholder="Recipient"><input class="input" id="subject" placeholder="Subject (email only)"><textarea class="textarea" id="body" placeholder="Write your message..."></textarea><div class="actions"><button class="btn" onclick="saveDraft()">Save draft</button><button class="btn primary" onclick="prepareMessage()">Prepare message</button></div></div></section><section class="card"><h3>Saved drafts</h3><div class="list">${data.drafts.map((d,i)=>`<div class="item"><span>${d.channel==='Email'?'✉':'▣'}</span><span>${escapeHtml(d.to||'No recipient')}</span><button class="btn" onclick="loadDraft(${i})">Open</button></div>`).join('')||'<div class="muted">No drafts yet.</div>'}</div></section></div>`)}function create(){shell('Create','Make something',`<div class="grid"><section class="card wide"><h3>Choose a starting point</h3><div class="creator"><div class="create-tile" onclick="newProject()"><b>▣ Project</b><div class="muted">Organize a bigger idea with tasks and notes.</div></div><div class="create-tile" onclick="newDocument()"><b>✎ Document</b><div class="muted">Start a clean writing space.</div></div><div class="create-tile" onclick="show('planner')"><b>▦ Plan</b><div class="muted">Turn an idea into scheduled steps.</div></div><div class="create-tile" onclick="newChecklist()"><b>☑ Checklist</b><div class="muted">Make a quick list of things to do.</div></div></div></section><section class="card"><h3>Projects</h3><div class="list">${data.projects.map((p,i)=>`<div class="item"><span>▣</span><span>${escapeHtml(p)}</span><button class="btn danger" onclick="deleteProject(${i})">×</button></div>`).join('')||'<div class="muted">No projects yet.</div>'}</div></section></div>`)}function toggleTask(i){data.tasks[i].done=!data.tasks[i].done;persist();dashboard()}function addTask(){const text=document.getElementById('taskText').value.trim();if(!text)return notify('Enter a task');data.tasks.push({text,when:document.getElementById('taskWhen').value||'No date',done:false});persist();notify('Task added');planner()}function addPlan(){const text=document.getElementById('planText').value.trim();if(!text)return notify('Enter a plan');data.plans.push({text,date:document.getElementById('planDate').value||'No date'});persist();notify('Plan added');planner()}function deletePlan(i){data.plans.splice(i,1);persist();planner()}function addQuickPlan(day){const text=prompt('Plan for October '+day+':');if(text){data.plans.push({text,date:'2026-10-'+String(day).padStart(2,'0')});persist();dashboard()}}function addNote(){const title=document.getElementById('noteTitle').value.trim()||'Untitled';const body=document.getElementById('noteBody').value.trim()||'Empty note';data.notes.unshift({title,body});persist();notify('Note saved');notes()}function loadNote(i){document.getElementById('noteTitle').value=data.notes[i].title;document.getElementById('noteBody').value=data.notes[i].body;window.scrollTo({top:0,behavior:'smooth'});notify('Note loaded for editing')}function deleteNote(i){data.notes.splice(i,1);persist();notes();notify('Note deleted')}function channelChanged(){const email=document.getElementById('channel').value==='Email';document.getElementById('subject').style.display=email?'block':'none'}function saveDraft(){const d={channel:document.getElementById('channel').value,to:document.getElementById('to').value,subject:document.getElementById('subject').value,body:document.getElementById('body').value};data.drafts.unshift(d);persist();notify('Draft saved')}function prepareMessage(){const to=document.getElementById('to').value||'recipient';const c=document.getElementById('channel').value;notify(c+' prepared for '+to);saveDraft()}function loadDraft(i){const d=data.drafts[i];document.getElementById('channel').value=d.channel;document.getElementById('to').value=d.to;document.getElementById('subject').value=d.subject||'';document.getElementById('body').value=d.body||'';channelChanged();notify('Draft opened')}function newProject(){const p=prompt('Project name:');if(p){data.projects.push(p);persist();create();notify('Project created')}}function newDocument(){data.notes.unshift({title:'New document',body:''});persist();notes();notify('Document created')}function newChecklist(){const text=prompt('Checklist item:');if(text){data.tasks.push({text,when:'Checklist',done:false});persist();notify('Checklist created');planner()}}function deleteProject(i){data.projects.splice(i,1);persist();create()}function filterPlans(mode){const list=document.getElementById('planList');if(mode==='all'){planner();return}const rows=data.plans.filter(p=>p.date&&p.date>='2026-10-01'&&p.date<='2026-10-07');list.innerHTML=rows.map(p=>`<div class="item"><span>▦</span><span><b>${escapeHtml(p.text)}</b><br><small class="muted">${p.date}</small></span></div>`).join('')||'<div class="muted">No plans this week.</div>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function notify(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',1800)}persist();dashboard();
const focusTimer={seconds:1500,running:false,interval:null,label:'Pomodoro'};function pomodoro(){shell('Focus Timer','Pomodoro & custom work sessions',`<div class="grid"><section class="card full timer-card"><h3>Choose a session</h3><div class="timer-presets"><button class="btn ${focusTimer.label==='Pomodoro'?'active':''}" onclick="setFocusPreset(25,'Pomodoro')">25 min Pomodoro</button><button class="btn ${focusTimer.label==='Deep Focus'?'active':''}" onclick="setFocusPreset(50,'Deep Focus')">50 min Deep Focus</button><button class="btn ${focusTimer.label==='Long Focus'?'active':''}" onclick="setFocusPreset(90,'Long Focus')">90 min Long Focus</button></div><div class="timer-display" id="timerDisplay">${formatFocusTime(focusTimer.seconds)}</div><div class="timer-status" id="timerStatus">${focusTimer.running?'Working — stay focused':'Ready for '+focusTimer.label}</div><div class="timer-controls"><button class="btn primary" id="timerStart" onclick="toggleFocusTimer()">${focusTimer.running?'Pause':'Start'}</button><button class="btn" onclick="resetFocusTimer()">Reset</button></div></section><section class="card"><h3>Set your own time</h3><p class="helper">Choose exactly how long you want to work. When it reaches zero, Organize Hub will play an alert.</p><div class="timer-custom"><div><label class="timer-label" for="focusHours">Hours</label><input class="input" id="focusHours" type="number" min="0" max="24" step="1" value="${Math.floor(focusTimer.seconds/3600)}"></div><div><label class="timer-label" for="focusMinutes">Minutes</label><input class="input" id="focusMinutes" type="number" min="0" max="59" step="1" value="${Math.floor((focusTimer.seconds%3600)/60)}"></div></div><button class="btn primary" style="margin-top:10px" onclick="setCustomFocus()">Use custom time</button></section><section class="card"><h3>How it works</h3><div class="list"><div class="item"><span>1</span><span>Pick a preset or set your own work time.</span></div><div class="item"><span>2</span><span>Start the timer and focus on one thing.</span></div><div class="item"><span>3</span><span>When time is up, you’ll hear an alert.</span></div></div></section></div>`);updateFocusTimerUI()}function formatFocusTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}function updateFocusTimerUI(){const d=document.getElementById('timerDisplay');if(d)d.textContent=formatFocusTime(focusTimer.seconds);const st=document.getElementById('timerStatus');if(st)st.textContent=focusTimer.running?'Working — stay focused':focusTimer.seconds===0?'Time is up!':'Ready for '+focusTimer.label;const b=document.getElementById('timerStart');if(b)b.textContent=focusTimer.running?'Pause':'Start'}function setFocusPreset(minutes,label){if(focusTimer.interval)clearInterval(focusTimer.interval);focusTimer.interval=null;focusTimer.running=false;focusTimer.seconds=minutes*60;focusTimer.label=label;pomodoro()}function setCustomFocus(){const h=Math.min(24,Math.max(0,Number(document.getElementById('focusHours').value)||0));const m=Math.min(59,Math.max(0,Number(document.getElementById('focusMinutes').value)||0));const total=Math.round(h*3600+m*60);if(!total)return notify('Set a time longer than 0');if(focusTimer.interval)clearInterval(focusTimer.interval);focusTimer.interval=null;focusTimer.running=false;focusTimer.seconds=total;focusTimer.label='Custom session';pomodoro();notify('Custom time set')}function toggleFocusTimer(){if(focusTimer.running){focusTimer.running=false;if(focusTimer.interval)clearInterval(focusTimer.interval);focusTimer.interval=null;updateFocusTimerUI();return}if(focusTimer.seconds<=0){notify('Set a new time first');return}focusTimer.running=true;focusTimer.interval=setInterval(()=>{focusTimer.seconds--;updateFocusTimerUI();if(focusTimer.seconds<=0){focusTimer.seconds=0;focusTimer.running=false;clearInterval(focusTimer.interval);focusTimer.interval=null;playTimerAlarm();notify('Time is up!')}},1000);updateFocusTimerUI()}function resetFocusTimer(){if(focusTimer.interval)clearInterval(focusTimer.interval);focusTimer.interval=null;focusTimer.running=false;focusTimer.seconds=focusTimer.label==='Pomodoro'?1500:focusTimer.label==='Deep Focus'?3000:focusTimer.label==='Long Focus'?5400:focusTimer.seconds;updateFocusTimerUI()}function playTimerAlarm(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[0,1,2,3].forEach(i=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.22);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+i*.22+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.22+.18);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.22);o.stop(ctx.currentTime+i*.22+.2)});setTimeout(()=>ctx.close(),1200)}catch(e){}}function games(){shell('Video Games','Your gaming space',`<div class="grid"><section class="card wide"><h3>My games</h3><div class="creator"><div class="create-tile" onclick="notify('Game selected')"><b>🎮 Adventure Quest</b><div class="muted">Adventure • Story • Single player</div></div><div class="create-tile" onclick="notify('Game selected')"><b>🏎️ Street Circuit</b><div class="muted">Racing • Competitive</div></div><div class="create-tile" onclick="notify('Game selected')"><b>⚔️ Realm Fighters</b><div class="muted">Action • Multiplayer</div></div><div class="create-tile" onclick="notify('Game selected')"><b>🧩 Puzzle Lab</b><div class="muted">Puzzle • Casual</div></div></div></section><section class="card"><h3>Player profile</h3><div class="note"><b>Male character</b><div class="muted">A customizable male video-game avatar for your gaming profile.</div></div><button class="btn primary" style="margin-top:12px" onclick="notify('Character profile opened')">Customize character</button></section><section class="card"><h3>Gaming checklist</h3><div class="list"><div class="item"><span class="check" onclick="this.textContent=this.textContent?'':'✓'"></span><span>Choose a game</span></div><div class="item"><span class="check" onclick="this.textContent=this.textContent?'':'✓'"></span><span>Set a play session</span></div><div class="item"><span class="check" onclick="this.textContent=this.textContent?'':'✓'"></span><span>Track achievements</span></div></div></section></div>`)}
function messages(){shell('Email & Messages','Simple, low-stress communication',`<div class="grid focus-mode"><section class="card wide"><h3>Write an email</h3><p class="helper">You can do this one step at a time. Nothing is sent until you choose to open your mail app.</p><div class="list" style="margin:14px 0"><div class="step"><span class="step-num">1</span><div><b>Who is it for?</b><input class="input" id="to" aria-label="Recipient email" placeholder="name@example.com" style="margin-top:7px"></div></div><div class="step"><span class="step-num">2</span><div style="width:100%"><b>What is it about?</b><input class="input" id="subject" aria-label="Email subject" placeholder="Short subject" style="margin-top:7px"></div></div><div class="step"><span class="step-num">3</span><div style="width:100%"><b>Choose a starting template</b><div class="template-row" style="margin-top:8px"><button class="template" onclick="emailTemplate('Hello,\n\nI wanted to ask about something.\n\nThank you,')">Ask a question</button><button class="template" onclick="emailTemplate('Hi,\n\nI wanted to let you know that…\n\nThanks,')">Give an update</button><button class="template" onclick="emailTemplate('Hi,\n\nThank you for your help with…\n\nBest,')">Say thank you</button></div></div></div><div class="step"><span class="step-num">4</span><div style="width:100%"><b>Write your message</b><textarea class="textarea" id="body" aria-label="Email message" placeholder="Start with Hello…"></textarea><div class="helper">Tip: short and clear is completely okay.</div></div></div></div><div class="actions"><button class="btn" onclick="saveAccessibleDraft()">Save for later</button><button class="btn" onclick="previewEmail()">Preview</button><button class="btn primary" onclick="openMailApp()">Open in Mail</button></div><div class="send-note" style="margin-top:12px">🔒 Your draft stays in this app until you choose “Open in Mail.” The app does not send it by itself.</div></section><section class="card"><h3>Before you send</h3><div class="list"><div class="item"><span>☐</span><span>Recipient looks right</span></div><div class="item"><span>☐</span><span>Subject is clear</span></div><div class="item"><span>☐</span><span>Message says what I need</span></div><div class="item"><span>☐</span><span>I’m ready to send</span></div></div></section><section class="card"><h3>Preview</h3><div id="emailPreview" class="note preview">Your email preview will appear here.</div></section></div>`)}
function emailTemplate(text){document.getElementById('body').value=text;notify('Template added — edit it as needed')}
function previewEmail(){const to=document.getElementById('to').value.trim()||'No recipient yet';const subject=document.getElementById('subject').value.trim()||'(No subject)';const body=document.getElementById('body').value.trim()||'No message yet.';document.getElementById('emailPreview').textContent='To: '+to+'\nSubject: '+subject+'\n\n'+body}
function saveAccessibleDraft(){const to=document.getElementById('to').value.trim();const subject=document.getElementById('subject').value.trim();const body=document.getElementById('body').value;data.drafts.unshift({channel:'Email',to,subject,body});persist();notify('Email saved for later')}
function openMailApp(){const to=document.getElementById('to').value.trim();const subject=document.getElementById('subject').value.trim();const body=document.getElementById('body').value;const params='?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);window.location.href='mailto:'+encodeURIComponent(to)+params}
</script></body></html>
